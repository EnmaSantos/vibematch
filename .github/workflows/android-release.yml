name: Android APK release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a tag on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vibematch-release.p12"
          test -s "$RUNNER_TEMP/vibematch-release.p12"
          chmod 600 "$RUNNER_TEMP/vibematch-release.p12"
      - name: Test, lint, and build signed APK
        working-directory: mobile/android
        env:
          VIBEMATCH_KEYSTORE_PATH: ${{ runner.temp }}/vibematch-release.p12
          VIBEMATCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          VIBEMATCH_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          VIBEMATCH_KEY_ALIAS: vibematch
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -PreleaseVersion="${GITHUB_REF_NAME#v}"
      - name: Verify and package APK
        run: |
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release
          cp "$apk" release/VibeMatch-Android.apk
          (cd release && sha256sum VibeMatch-Android.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/VibeMatch-Android.apk release/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "VibeMatch $GITHUB_REF_NAME - Android preview" \
            --notes-file mobile/RELEASE_NOTES.md
