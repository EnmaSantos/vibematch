name: Native mobile checks
on:
  pull_request:
    paths: ['mobile/**', 'src/lib/**', 'src/app/api/mobile/**', 'tests/**', 'package*.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:mobile-api
      - run: npm run lint
      - run: npm run build

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run --package-path mobile/ios CoreVerification
      - name: Build iOS simulator app
        run: xcodebuild -project mobile/ios/VibeMatch.xcodeproj -scheme VibeMatch -destination 'generic/platform=iOS Simulator' -derivedDataPath mobile/ios/DerivedData CODE_SIGNING_ALLOWED=NO build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
